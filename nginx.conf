server {
    listen 80;
    server_name localhost;
    charset utf-8;

    client_max_body_size 50M;

    # Giao diện Frontend AdminLTE
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate HTML/JS/CSS so a changed app.js is picked up immediately
    # (nginx sends ETag; browser does a conditional GET -> 304 when unchanged).
    # Replaces the manual `python init_frontend.py` cache-buster step.
    location ~* \.(?:html?|js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        etag on;
    }

    # Reverse Proxy cho toàn bộ API Backend
    location /api/ {
        proxy_pass http://procurement-server:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://procurement-server:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # FastAPI Docs & OpenAPI
    location /docs {
        proxy_pass http://procurement-server:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://procurement-server:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
